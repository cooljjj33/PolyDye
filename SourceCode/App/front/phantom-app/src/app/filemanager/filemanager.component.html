<h2>File List</h2>

    <canvas #myCanvas width="1666" height="2382" style="display: none;"></canvas>
    <input type="file" #fileInput accept=".gcode,.jpg,.png" (change)="onFileSelect($event)" style="display: none;" multiple>

  <button class="w3-button w3-ripple w3-blue w3-opacity-min" (click)="refresh()">Refresh</button>

  <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="margin-left: 5px;"
    (click)="printFile()">Print</button>

    <input hidden type="file" #fileInputUpload (change)="onFilesSelected($event)">
    <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="margin-left: 5px;" (click)="upload()">Upload</button>
    <button class="w3-button w3-ripple w3-green w3-opacity-min" style="margin-left: 5px;" (click)="fileInput.click()">Align</button>
    <div class="progress-container" *ngIf="busyUploading">
      <div class="progress-bar">
        <div class="progress-bar-fill w3-blue">
          <div class="progress-inner" [style.width]="progress + '%'">{{ progress }}%</div>
        </div>
      </div>
    </div>

  <div class="w3-container scrollable-div">
    <div *ngFor="let file of payload.fileList">
      <li class="w3-button w3-bar" style="height:50px; " (click)="selectFile(file)">

        <div class="w3-bar-item" style="margin: 0; padding-top: 3px;">
          <span class="w3-large">{{file.fileName}}</span><br>
        </div>
      </li>
    </div>
    <hr class="w3-black" style="margin: 0"/>
  </div>

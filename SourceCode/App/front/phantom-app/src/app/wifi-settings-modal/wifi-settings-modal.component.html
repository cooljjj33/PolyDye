<div #wifiModal id="wifiModal" class="w3-modal" [ngClass]="{'w3-show': isModalOpen}">
  <div class="w3-modal-content  background-light-gray padding-bottom-small modal-content-medium">
    <div class="w3-container">
      <span (click)="closeModal()" class="w3-button w3-display-topright">&times;</span>
      <h2>WiFi Settings</h2>
      <form (ngSubmit)="onSubmit()">
        <div class="w3-row">
          <div class="w3-col s4">
            <label for="ssid">SSID:</label>
          </div>
          <div class="w3-col s8">
            <input class="w3-input w3-left w3-twothird" [(ngModel)]="ssid" type="text" id="ssid" name="ssid">
          </div>
        </div>
        <div class="w3-row">
          <div class="w3-col s4">
            <label for="password">Password:</label>
          </div>
          <div class="w3-col s8">
            <input class="w3-input w3-left w3-twothird" [(ngModel)]="password" type="password" id="password" name="password">
          </div>
        </div>
        <div class="w3-row">
          <div class="w3-col s12">
            <button type="button" class="w3-button w3-red" (click)="closeModal()">Cancel</button>
            <button type="submit" class="w3-button w3-green">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

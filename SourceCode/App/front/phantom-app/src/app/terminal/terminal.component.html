<h2>Terminal</h2>
<div class="w3-container scrollable-div bg-white" (scroll)="scrolled($event)" #scrollframe>
  <div *ngFor="let item of items" class="item" #item>
    {{item}}
  </div>

</div>
  <input class="w3-input w3-left" [(ngModel)]="message" type="text" style="width: 87%;margin-left: 4px;" (keydown)="onKeyDown($event)"/>
  <button class="w3-button w3-ripple w3-blue w3-opacity-min w3-center w3-rest"
    style=" padding-left: 18px;" (click)="sendCommand()">Send</button>

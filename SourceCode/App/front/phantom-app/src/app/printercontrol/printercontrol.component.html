<h2 style="margin-top:25px">X/Y Offset Tuning</h2>
<div class="w3-container margin-top-s" style="margin-top: 7%;">
  <div class="w3-row">
    <div id="LEFT1" class="w3-col s6 w3-center">

      <div class="w3-bar" style="display: flex; flex-direction: column; align-items: center;">
        <div style="font-size: small;font-weight: bold;">Ink Backward</div>
        <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="width:50px;"
          (click)="sendMove('Front')">
          <fa-icon [icon]="faArrowUp"></fa-icon>
        </button>
      </div>

      <div class="w3-container" style="margin-top: 20px;">
        <div class="w3-center">
          <div class="w3-bar" style="display: flex; align-items: center; justify-content: center;">
            <div style="margin-right: 5px;font-size: small;font-weight: bold;">Ink Left</div>
            <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="width:50px;"
              (click)="sendMove('Left')">
              <fa-icon [icon]="faArrowLeft"></fa-icon>
            </button>

            <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="width:50px; margin-left: 5px; margin-right: 5px;"></button>

            <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="width:50px;"
              (click)="sendMove('Right')">
              <fa-icon [icon]="faArrowRight"></fa-icon>
            </button>
            <div style="margin-left: 5px;font-size: small;font-weight: bold;">Ink Right</div>
          </div>
        </div>
      </div>

      <div class="w3-container" style="margin-top: 20px;">
        <div class="w3-center">
          <div class="w3-bar" style="display: flex; flex-direction: column; align-items: center;">
            <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="width:50px;"
              (click)="sendMove('Back')">
              <fa-icon [icon]="faArrowDown"></fa-icon>
            </button>
            <div style="font-size: small;font-weight: bold;">Ink Forward</div>
          </div>
        </div>
      </div>
    </div>

    <div id="RIGHT1" class="w3-col s6 w3-center" style="margin-top:25px">
      <button [class.selected]="selectedMoveAmount === 0.02" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:80px" (click)="setMoveAmount(0.02)">0.02</button>
      <button [class.selected]="selectedMoveAmount === 0.05" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:80px" (click)="setMoveAmount(0.05)">0.05</button>
      <button [class.selected]="selectedMoveAmount === 0.1" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:80px" (click)="setMoveAmount(0.1)">0.1</button>
      <button [class.selected]="selectedMoveAmount === 0.2" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:80px" (click)="setMoveAmount(0.2)">0.2</button>
      <button [class.selected]="selectedMoveAmount === 0.3" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:80px" (click)="setMoveAmount(0.3)">0.3</button>
      <button [class.selected]="selectedMoveAmount === 0.4" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:80px" (click)="setMoveAmount(0.4)">0.4</button>
    </div>
  </div>
</div>
<div class="w3-container margin-top-s mobile-button" style="display: block;">
<h2 style="margin-top:-25px; width: 61%;">YohY Alignment</h2>

  <div class="w3-row" style="display: flex;">
    <div id="LEFT2" class="w3-col s6 w3-center" >

        <div class="w3-center">
          <div class="w3-bar" style="margin-top: 13%;">
            <button class="w3-button w3-ripple w3-blue w3-opacity-min" style="width:50px; height: 60px;"
              (click)="sendAlign('Up')"><fa-icon [icon]="faArrowUp"></fa-icon></button>

            <button class="w3-button w3-ripple w3-gray w3-opacity-min" style="width:50px; height: 60px;"
              (click)="sendAlign('Down')"><fa-icon [icon]="faArrowDown"></fa-icon></button>
          </div>
        </div>

    </div>
    <div id="RIGHT2" class="w3-col s6 w3-center" style="width:100%; margin-top:4%">
      <button [class.selected]="selectedAlignAmount === 500" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:60px" (click)="setAlignAmount(500)">500</button>
      <button [class.selected]="selectedAlignAmount === 1000" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:60px" (click)="setAlignAmount(1000)">1k</button>
      <button [class.selected]="selectedAlignAmount === 2000" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:60px" (click)="setAlignAmount(2000)">2k</button>
      <button [class.selected]="selectedAlignAmount === 5000" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:60px" (click)="setAlignAmount(5000)">5k</button>
      <button [class.selected]="selectedAlignAmount === 10000" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:60px" (click)="setAlignAmount(10000)">10k</button>
      <button [class.selected]="selectedAlignAmount === 20000" class="w3-button w3-ripple w3-blue w3-opacity-min"
        style="width:60px" (click)="setAlignAmount(20000)">20k</button>
    </div>
  </div>

</div>

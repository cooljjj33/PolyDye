<h2>Print Job</h2>
<div class="w3-container">
  <div class="ender3-screen w3-card-4">

    <div class="ender3-status">
      <p>Progress: </p>
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-bar-fill w3-blue w3-center">
            <div class="progress-inner" [style.width]="progress + '%'">{{ progress }}%</div>
          </div>
        </div>
      </div>
      <p>Temperature:</p>
      <div class="progress-container">
        <div class="temperature-label w3-blue"><img class="img-progress" src="assets/img/nozzleicon.png"></div>
        <div  class="temperature-text w3-blue-gray">
          {{(!nozzleTemp) || (nozzleTemp == "") ? "NA" : nozzleTemp}}
        </div>
        <div style="margin-left: 39%;">&nbsp;</div>
        <div class="temperature-label w3-blue"><img class="img-progress" src="assets/img/bedicon.png"></div>
        <div  class="temperature-text w3-amber">
          {{(!bedTemp) || (bedTemp == "") ? "NA" : bedTemp}}
        </div>
      </div>
      <p>Remaining Time:</p>
      <div class="progress-container">
        <div class="temperature-label w3-blue"><img class="img-progress" src="assets/img/speedicon.png"></div>
        <div  class="temperature-text w3-grey">
          {{hours}}h {{minutes}}m
        </div>
      </div>

    </div>

  </div>
  <button class="w3-button w3-ripple w3-red" style="margin-top: 8px;" (click)="cancelPrint()">Cancel Print</button>
</div>
